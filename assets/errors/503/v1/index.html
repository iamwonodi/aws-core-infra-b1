<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>503 Service unavailable</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { margin: .25rem 0; line-height: 1.5; }
    .code { font-size: 4rem; font-weight: 700; opacity: .35; margin: 0; }
  </style>
</head>
<body>
  <main>
    <p class="code">503</p>
    <h1>Service unavailable</h1>
    <p>The service is temporarily unavailable, usually during a deployment or maintenance.</p>
    <p>Please try again in a few minutes.</p>
  </main>
</body>
</html>
