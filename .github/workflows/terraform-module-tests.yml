name: Terraform Module Tests

# ==============================================================================
# Runs the native "terraform test" suites of the modules that can be tested
# without AWS: they contain no provider resources, only variables, locals and
# preconditions.
#
#   github-identity   OIDC subject generation and its invariants
#   service-roles     generated service policies and their invariants
#   service-boundary  the IAM permissions boundary for roles services create
#   platform-contract the document services read to learn about the environment
#   database-engines-role  the platforms team's generated role
#   people            the platform list's database logins (mocked AWS)
#   front-door        the tools' sign-in and the function behind it (mocked AWS)
#   tools-role        the team-tools repository's generated role
#   dns-delegation    the public zone's kept delegation set (mocked AWS)
#   network           CIDR invariants (validations.tf, tested in isolation)
# ==============================================================================

on:
  pull_request:
    paths:
      - "modules/platform/identity/**"
      - "modules/platform/service-roles/**"
      - "modules/platform/service-boundary/**"
      - "modules/platform/contract/**"
      - "modules/platform/engines-role/**"
      - "modules/platform/people/**"
      - "modules/platform/front-door/**"
      - "modules/platform/tools-role/**"
      - "modules/platform/dns-delegation/**"
      - "modules/database/schedule/**"
      - "modules/database/host/**"
      - "scripts/ci/check-data-volume-plan.sh"
      - "modules/network/variables.tf"
      - "modules/network/validations.tf"
      - "modules/network/tests/**"
      - "modules/edge/variables.tf"
      - "modules/edge/locals.tf"
      - "modules/edge/tests/**"
      - "modules/network/nacl-security/variables.tf"
      - "modules/network/nacl-security/locals.tf"
      - "modules/network/nacl-security/tests/**"
      - ".github/workflows/terraform-module-tests.yml"
  push:
    branches:
      - main
    paths:
      - "modules/platform/identity/**"
      - "modules/platform/service-roles/**"
      - "modules/platform/service-boundary/**"
      - "modules/platform/contract/**"
      - "modules/platform/engines-role/**"
      - "modules/platform/people/**"
      - "modules/platform/front-door/**"
      - "modules/platform/tools-role/**"
      - "modules/platform/dns-delegation/**"
      - "modules/database/schedule/**"
      - "modules/database/host/**"
      - "scripts/ci/check-data-volume-plan.sh"
      - "modules/network/variables.tf"
      - "modules/network/validations.tf"
      - "modules/network/tests/**"
      - "modules/edge/variables.tf"
      - "modules/edge/locals.tf"
      - "modules/edge/tests/**"
      - "modules/network/nacl-security/variables.tf"
      - "modules/network/nacl-security/locals.tf"
      - "modules/network/nacl-security/tests/**"
      - ".github/workflows/terraform-module-tests.yml"

permissions:
  contents: read

jobs:

  test:
    name: Terraform Module Tests
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: github-identity
        working-directory: modules/platform/identity
        run: |
          terraform init -backend=false
          terraform test

      - name: service-roles
        working-directory: modules/platform/service-roles
        run: |
          terraform init -backend=false
          terraform test

      - name: service-boundary
        working-directory: modules/platform/service-boundary
        run: |
          terraform init -backend=false
          terraform test

      - name: platform-contract
        working-directory: modules/platform/contract
        run: |
          terraform init -backend=false
          terraform test

      - name: database-engines-role
        working-directory: modules/platform/engines-role
        run: |
          terraform init -backend=false
          terraform test

      - name: people
        working-directory: modules/platform/people
        run: |
          terraform init -backend=false
          terraform test

      - name: front-door
        working-directory: modules/platform/front-door
        run: |
          terraform init -backend=false
          terraform test

      - name: tools-role
        working-directory: modules/platform/tools-role
        run: |
          terraform init -backend=false
          terraform test

      - name: dns-delegation
        working-directory: modules/platform/dns-delegation
        run: |
          terraform init -backend=false
          terraform test

      - name: database-schedule
        working-directory: modules/database/schedule
        run: |
          terraform init -backend=false
          terraform test

      # The data volume must not be replaced by a change around the host. The
      # script runs the module's tests and reads the plan they print: see its
      # header for why an assertion cannot see this.
      - name: database-host data volume
        run: |
          terraform -chdir=modules/database/host init -backend=false
          bash scripts/ci/check-data-volume-plan.sh

      - name: network invariants
        run: bash modules/network/tests/run.sh

      - name: edge load balancer names
        run: bash modules/edge/tests/run.sh

      - name: network ACL rules
        run: bash modules/network/nacl-security/tests/run.sh
